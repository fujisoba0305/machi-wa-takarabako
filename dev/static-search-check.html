<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'self' ws://localhost:5173 ws://127.0.0.1:5173"><title>静的検索のローカル確認</title><style>body{font-family:sans-serif;max-width:620px;margin:32px auto;padding:16px;line-height:1.7;background:#fff9ee;color:#493623}button{padding:16px;margin:8px 0;font-size:16px;cursor:pointer}#result{white-space:pre-wrap;background:white;padding:20px;border-radius:16px}</style></head><body><h1>本体の静的検索を確認</h1><p>開発用の独立確認ページです。本体が使用するProviderをそのまま呼びます。公開テスト座標のみで、端末GPS・報酬・ログイン・DB・外部APIは使いません。</p><button id="search">東京駅のカフェを抽選する</button><button id="empty">辻堂の写真条件を確認する</button><p id="result" role="status">確認ボタンを押してください。</p><p id="link"></p><p>© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>／ODbL 1.0</p><script type="module">
import {loadLocalStaticFacilities} from '/src/services/staticFacilities.ts';
import {selectNormalSearchCandidate} from '/src/features/normalTreasureCandidates.ts';
import {buildGoogleMapsDirectionsUrl} from '/src/features/googleMaps.ts';
const originalFetch=window.fetch.bind(window);let assetReads=0;window.fetch=(url,options)=>{if(typeof url!=='string'||!url.startsWith('/facilities-local-v1/'))throw Error('検証ページでは外部API通信は禁止です');assetReads++;return originalFetch(url,options)};
async function check(gps,mood){const result=document.getElementById('result');result.textContent='ローカルデータを確認しています…';try{const rows=await loadLocalStaticFacilities(gps,{mood,distance:'？km'},3000),selected=selectNormalSearchCandidate(rows||[],[]);result.textContent=`方式：${rows===null?'旧検索対象（このページでは実行しません）':'static-local'}\n候補：${rows?.length??0}件\n抽選結果：${selected?.candidate.tags.name||'条件内候補なし'}\n静的ファイル読込：${assetReads}回\n外部API：0回\n端末GPS：未使用`;document.getElementById('link').replaceChildren();if(selected){const a=document.createElement('a');a.textContent='Google Maps徒歩リンク（通常URL）';a.href=buildGoogleMapsDirectionsUrl(gps,{latitude:selected.candidate.lat,longitude:selected.candidate.lon});a.target='_blank';a.rel='noopener';document.getElementById('link').append(a)}}catch{result.textContent='静的データを読み込めませんでした。外部APIへ切り替えていません。'}}
document.getElementById('search').onclick=()=>check({latitude:35.681236,longitude:139.767125},'カフェ');document.getElementById('empty').onclick=()=>check({latitude:35.3365,longitude:139.447},'写真');
</script></body></html>
